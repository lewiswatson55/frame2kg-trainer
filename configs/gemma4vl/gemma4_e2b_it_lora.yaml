training_repo: "https://github.com/lewiswatson55/frame2kg-trainer"
backend: gemma4_vl
model_id: google/gemma-4-E2B-it
load_in_4bit: true
lora:
  r: 16
  alpha: 16
  dropout: 0.05

# training
seed: 42
run_name: gemma4-e2b-it-frame2kg
output_dir: ../output
max_new_tokens: 4098
lr: 5e-5
epochs: 3
per_device_train_bs: 1
per_device_eval_bs: 1
grad_acc_steps: 8
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 10
save_steps: 20
save_total_limit: 2
eval_steps: 20
num_workers: 16
eval_sample_k: 3
eval_sample_mode: random
export_merged: false

wandb:
  project: gemma4-e2b-it-frame2kg-proj
  entity: null
