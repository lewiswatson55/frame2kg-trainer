training_repo: "https://github.com/lewiswatson55/frame2kg-trainer"
backend: lfm25_vl
model_id: LiquidAI/LFM2.5-VL-450M
load_in_4bit: false
target_format: compressed_tokens
dataset_id: lewiswatson/Frame2KG-YC2-compressed-tokens
dataset_token: true
graph_key_order: dataset
include_processor_in_adapter_checkpoints: true
tokenizer_added_tokens:
  - "<|graph|>"
  - "<|nodes|>"
  - "<|node|>"
  - "<|id|>"
  - "<|label|>"
  - "<|bbox|>"
  - "<|conf|>"
  - "<|attrs|>"
  - "<|edges|>"
  - "<|edge|>"
  - "<|src|>"
  - "<|pred|>"
  - "<|tgt|>"
  - "<|end_graph|>"
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, out_proj, w1, w2, w3]

# training
seed: 42
run_name: lfm25vl-450m-frame2kg-compressed-tokens
output_dir: ../output
max_new_tokens: 4098
lr: 5e-5
epochs: 3
per_device_train_bs: 8
per_device_eval_bs: 2
grad_acc_steps: 1
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 10
save_steps: 100
save_total_limit: 2
eval_steps: 20
num_workers: 12
eval_sample_k: 3
eval_sample_mode: random
export_merged: false
skip_eval: true

wandb:
  project: frame2kg-proj-postpaper-eval
  entity: null
