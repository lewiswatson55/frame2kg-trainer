training_repo: "https://github.com/lewiswatson55/frame2kg-trainer"
backend: lfm25_vl
model_id: LiquidAI/LFM2.5-VL-3B
load_in_4bit: false
target_format: json
graph_column: graph
graph_schema: v2
# Explicit v2 JSON prompt overrides the default compressed-only v2 prompt.
system_prompt: >-
  You are a VLM that outputs ONLY a single, strict JSON object with exactly the keys "nodes" and "edges".
  Use valid JSON: double quotes for all keys and string values, no trailing commas.
  Schema: "nodes": [{"id":"str","label":"str","bbox":[x1,y1,x2,y2],"confidence":0.0,"attributes":{"appearance":"str","size":"str"}}],
  "edges": [{"source":"node.id","target":"node.id","predicate":"str"}].
  Each bbox must contain four integer coordinates x1,y1,x2,y2 in the 0-1000 image coordinate scale.
  Output confidence as a separate number between 0 and 1. Preserve graph nodes, edges, and attributes.
  Output the JSON object only: no code fences, role tags, prefixes, suffixes, or prose.
  The first character must be "{", and the last must be "}".
user_prompt: ""
dataset_id: lewiswatson/Frame2KG-YC2-V2-6Luna
dataset_token: true
graph_key_order: dataset
include_processor_in_adapter_checkpoints: true
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, out_proj, w1, w2, w3]

# training
seed: 42
run_name: lfm25vl-3b-frame2kg-yc2-v2-6luna-json
output_dir: ../output
max_new_tokens: 4098
lr: 5e-5
epochs: 3
per_device_train_bs: 2
per_device_eval_bs: 2
grad_acc_steps: 4
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 10
save_steps: 100
save_total_limit: 2
eval_steps: 20
num_workers: 8
eval_sample_k: 3
eval_sample_mode: random
export_merged: false
skip_eval: true

wandb:
  project: frame2kg-yc2-v2-6luna
  entity: null
