training_repo: "https://github.com/lewiswatson55/frame2kg-trainer"
backend: qwen25_vl
model_id: Qwen/Qwen2.5-VL-3B-Instruct
min_pixels: 200704
max_pixels: 878080
load_in_4bit: false
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj] #, gate_proj, down_proj, up_proj]

# training
seed: 42
run_name: qwen25vl-frame2kg-a100-40gb
output_dir: ../output
max_new_tokens: 4098
lr: 5e-5
epochs: 3
per_device_train_bs: 8
per_device_eval_bs: 2
grad_acc_steps: 1
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 10
save_steps: 20
save_total_limit: 2
eval_steps: 20
num_workers: 16
eval_sample_k: 3
eval_sample_mode: random
export_merged: false

wandb:
  project: qwen25vl-frame2kg-a100-40gb-proj
  entity: null
