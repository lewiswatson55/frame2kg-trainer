[project]
name = "frame2kg_train"
version = "0.1.0"
description = "Frame→KG training with pluggable VLM backends"
authors = [{name="Lewis Watson"}]
requires-python = ">=3.10"
dependencies = [
  "transformers==5.9.0",
  "datasets",
  "accelerate",
  "peft==0.19.1",
  "bitsandbytes; platform_system == 'Linux'",
  "wandb",
  "num2words",
  "Pillow",
  "PyYAML",
  "timm",
  "torch",
  "torchvision",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
